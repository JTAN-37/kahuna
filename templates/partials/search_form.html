<div class="search-area {% if stocks %}top{% endif %}">
  {% if error %}
  <div class="error-banner">{{ error }}</div>
  {% endif %}
  <div class="logo-placeholder">K</div>
  <p class="prompt-text">Select a stock to begin analysis</p>
  <form method="POST" action="/" id="ticker-form">
    <input type="hidden" name="stocks_state" id="stocks-state-field"
           value="{{ stocks_json | e }}">
    <div class="autocomplete-wrapper" id="autocomplete-wrapper">
      <input type="text" name="ticker" id="ticker-input" class="ticker-input"
             placeholder="Search ticker or company…" autocomplete="off">
      <ul class="autocomplete-list" id="autocomplete-list" role="listbox" hidden></ul>
    </div>
    <button type="submit" class="submit-btn">Analyze</button>
  </form>
</div>
