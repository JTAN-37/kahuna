<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahuna</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js" defer></script>
  <script>
    window.KAHUNA = {
      sp500:  {{ sp500  | tojson }},
      stocks: {{ stocks | tojson }},
      active: {{ active | tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='js/logos.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/tabs.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/autocomplete.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/analysis.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>

  <nav class="navbar">
    <a class="navbar-title" href="{{ url_for('index') }}" onclick="if(typeof addNewTab==='function'){addNewTab();return false;}">Kahuna</a>
    <form method="POST" action="/" id="ticker-form" class="navbar-search">
      <input type="hidden" name="stocks_state" id="stocks-state-field" value="{{ stocks_json | e }}">
      <div class="autocomplete-wrapper" id="autocomplete-wrapper">
        <svg class="navbar-search-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" name="ticker" id="ticker-input" class="ticker-input"
               placeholder="Search ticker or company…" autocomplete="off">
        <button type="submit" class="navbar-search-btn" title="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
        <ul class="autocomplete-list" id="autocomplete-list" role="listbox" hidden></ul>
      </div>
    </form>
  </nav>

  <div class="content-wrapper">
    {% include 'partials/sidebar.html' %}

    <main class="main-content {% if stocks %}has-stocks{% endif %}" id="main-content">
      {% include 'partials/search_form.html' %}
      {% include 'partials/stock_panel.html' %}
    </main>
  </div>

</body>
</html>
